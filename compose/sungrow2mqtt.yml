# Sungrow to MQTT Bridge
# Off-the-shelf image per ADR-013

services:
  sungrow2mqtt:
    image: bohdan0/sungrow2mqtt:latest
    container_name: lares-sungrow2mqtt
    restart: unless-stopped
    networks:
      - lares
    environment:
      - MODBUS_HOST=lares-modbus-proxy
      - MODBUS_PORT=502
      - MQTT_HOST=lares-mosquitto
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_TOPIC_PREFIX=energy/sungrow
      - POLL_INTERVAL=5

networks:
  lares:
    external: true
