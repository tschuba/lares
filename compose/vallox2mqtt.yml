# Vallox to MQTT Bridge
# Custom Python bridge for Vallox ventilation (ADR-006)

services:
  vallox2mqtt:
    build:
      context: ../bridges/vallox
      dockerfile: Dockerfile
    container_name: vallox2mqtt
    restart: unless-stopped
    networks:
      - lares
    environment:
      - VALLOX_HOST=${VALLOX_IP}
      - VALLOX_PORT=18080
      - POLL_INTERVAL=30
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_CLIENT_ID=vallox2mqtt
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_TOPIC_PREFIX=ventilation/vallox
      - LOG_LEVEL=INFO
    volumes:
      - ./logs/vallox2mqtt:/app/logs

networks:
  lares:
    external: true
