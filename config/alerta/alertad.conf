# Alerta-Serverkonfiguration (ADR-019). Überschreibt Defaults aus alerta/settings.py.
# Nur Heimnetz (ADR-007), daher kein Login.
AUTH_REQUIRED = False

# Posteingang: Alarme laufen nicht von selbst ab; ohne Resolve-Meldung bleiben sie offen,
# bis sie quittiert/geschlossen werden.
ALERT_TIMEOUT = 0
ACK_TIMEOUT = 0
SHELVE_TIMEOUT = 0

# Verlauf: geschlossene/abgelaufene Alarme 90 Tage aufbewahren.
DELETE_EXPIRED_AFTER = 90 * 24 * 60 * 60
DELETE_INFO_AFTER = 90 * 24 * 60 * 60

# Grafana sendet Labels, keine Umgebung; alle Alarme gehören zu "Production".
DEFAULT_ENVIRONMENT = 'Production'
