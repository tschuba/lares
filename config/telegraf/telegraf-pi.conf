# Telegraf Configuration for Raspberry Pi (192.168.178.69)
# Collects system metrics only (no MQTT) and writes to NAS InfluxDB.
# Deployed as a Coolify project on the Pi via docker-compose.pi.yml.

[agent]
  omit_hostname = true
  interval = "30s"

[global_tags]
  host = "pi"

# ─── System metrics ────────────────────────────────────────────────────────────

[[inputs.cpu]]
  percpu = false
  totalcpu = true

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs", "proc"]

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  source_tag = true
  timeout = "5s"
  total_include = ["cpu"]

# ─── Output: InfluxDB v2 on NAS ───────────────────────────────────────────────

[[outputs.influxdb_v2]]
  urls = ["http://${INFLUX_HOST}:${INFLUX_PORT}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
