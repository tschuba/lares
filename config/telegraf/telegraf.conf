# Telegraf Configuration for MQTT to InfluxDB
# Consumes Meross energy metrics from MQTT and writes to InfluxDB v2

[agent]
  omit_hostname = true
  interval = "30s"

# MQTT Consumer Input
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER}:${MQTT_PORT}"]
  topics = [
    "homie/#",
    "energy/#",
    "ventilation/#",
    "weather/#"
  ]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  client_id = "telegraf"
  data_format = "json"
  json_strict = true
  tag_keys = ["device", "location"]
  
  # Topic parsing for Homie convention (meross2mqtt uses this)
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "homie/+/+"
    measurement = "_/_/measurement"
    tags = "device,location"

# InfluxDB v2 Output
[[outputs.influxdb_v2]]
  urls = ["http://${INFLUX_HOST}:${INFLUX_PORT}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
