# Telegraf Configuration for MQTT to InfluxDB
# Consumes data from all MQTT bridges and writes to InfluxDB v2

[agent]
  omit_hostname = true
  interval = "30s"

# ─── System metrics ────────────────────────────────────────────────────────────

[[inputs.cpu]]
  percpu = false
  totalcpu = true

[[inputs.mem]]

# ─── MQTT: Weather (ecowitt2mqtt) ─────────────────────────────────────────────
# ecowitt2mqtt publishes a single JSON blob to weather/ecowitt
# Field names depend on ecowitt2mqtt version/unit config — verify with:
#   docker exec mosquitto mosquitto_sub -t 'weather/ecowitt' -C 1
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER}:${MQTT_PORT}"]
  topics = ["weather/ecowitt"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  client_id = "telegraf-weather"
  data_format = "json"
  name_override = "weather"

# ─── MQTT: Heating (luxtronik2mqtt) ───────────────────────────────────────────
# Publishes JSON to heating/novelan/state
# Temperaturen:      temperature_outside, temperature_hot_water, temperature_flow, temperature_return
# Wärmemengen:       heat_energy_heating, heat_energy_hot_water, heat_energy_total (kWh, ~2h Auflösung)
# Laufzeiten:        runtime_compressor, runtime_heating, runtime_hot_water, runtime_total (Sekunden)
#                    runtime_compressor_starts (Anzahl Starts)
# Betriebsmodus:     operating_mode (enum)
# Elektr. Verbrauch: electric_power_actual (kW, Echtzeit), electric_energy_total,
#                    electric_energy_heating, electric_energy_dhw (kWh, SHI/Modbus Port 502, FW>=3.90.1)
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER}:${MQTT_PORT}"]
  topics = ["heating/novelan/state"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  client_id = "telegraf-heating"
  data_format = "json"
  name_override = "heating"

# ─── MQTT: Ventilation (vallox2mqtt) ──────────────────────────────────────────
# Publishes individual string values to ventilation/vallox/<metric>
# Stored as: measurement=ventilation, _field=value, tag metric=<name>
# Query example: r._measurement == "ventilation" and r["metric"] == "fan_speed"
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER}:${MQTT_PORT}"]
  topics = ["ventilation/vallox/#"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  client_id = "telegraf-ventilation"
  data_format = "value"
  data_type = "float"
  name_override = "ventilation"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "ventilation/vallox/+"
    tags = "_/_/metric"

# ─── MQTT: Sungrow (SunGather) ────────────────────────────────────────────────
# SunGather publishes a single JSON blob to energy/sungrow
# Fields: total_active_power, battery_power, battery_level, load_power_hybrid,
#         export_power_hybrid, import_from_grid, export_to_grid, ...
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER}:${MQTT_PORT}"]
  topics = ["energy/sungrow"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  client_id = "telegraf-sungrow"
  data_format = "json"
  name_override = "sungrow"

# ─── MQTT: Meross (meross2mqtt via Homie convention) ──────────────────────────
# Topic structure: homie/<device-id>/<node>/<property>
# Stored as: measurement=meross, _field=value, tags device+node+property
# Query example: r._measurement == "meross" and r["node"] == "electricity" and r["property"] == "power"
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER}:${MQTT_PORT}"]
  topics = ["homie/+/electricity/+", "homie/+/energy/+"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  client_id = "telegraf-meross"
  data_format = "value"
  data_type = "float"
  name_override = "meross"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "homie/+/+/+"
    tags = "_/device/node/property"

# ─── Output: InfluxDB v2 ───────────────────────────────────────────────────────

[[outputs.influxdb_v2]]
  urls = ["http://${INFLUX_HOST}:${INFLUX_PORT}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
