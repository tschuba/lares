# Mosquitto Configuration for Lares
# Internal MQTT broker - no external access

# --- Standard Listener (interne Services, Home Assistant) ---
listener 1883
allow_anonymous true

# Authentication (disabled for initial setup - enable after testing)
# password_file /mosquitto/config/passwd

# --- TLS Listener fuer Meross-Geraete (ADR-015) ---
# Meross-Geraete verbinden sich hier per DNS-Interception (iot.meross.com -> NAS-IP).
# Zertifikate werden von cert-init beim ersten Start auto-generiert.
listener 8883
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
allow_anonymous true

# --- Persistence ---
persistence true
persistence_location /mosquitto/data/

# --- Logging ---
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# --- Connection settings ---
max_connections -1
max_queued_messages 1000

# Security: No websockets enabled - internal LAN only
