# Meross to MQTT Homie Bridge – Konfiguration (ADR-011)
#
# MQTT-Credentials (mqtt_username, mqtt_password) und Meross-Cloud-Credentials
# (meross_email, meross_password) werden beim Start automatisch aus den
# Umgebungsvariablen injiziert.

log_level: INFO

# MQTT-Broker (wird per Env-Variable ueberschrieben, hier nur Fallback)
mqtt_host: mosquitto
mqtt_port: 1883
mqtt_clean_session: true

# Homie MQTT-Prefix
homie_prefix: homie

# Geraete: optionale Umbenennung pro UUID
# Format:
#   <uuid>:
#     pretty_name: "Lesbarer Name"
#     pretty_topic: "homie-topic-id"   # optional
devices: {}
