apiVersion: 1

providers:
  - name: 'lares'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    options:
      # This path refers to the path *inside* the Grafana container
      # where the JSON files will be mounted.
      path: /var/lib/grafana/dashboards
