apiVersion: 1

groups:
  - orgId: 1
    name: Lares
    folder: Lares
    interval: 1m
    rules:

      # CO₂ Warnung — DIN EN 13779 IDA 3 (>1000 ppm, sustained 5 min)
      - uid: lares-co2-warning
        title: CO₂ Warnung IDA 3
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -10m)
                  |> filter(fn: (r) => r._measurement == "ventilation" and r["metric"] == "co2_level")
                  |> mean()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - evaluator: {params: [1000], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: CO₂-Wert überschreitet 1000 ppm (IDA-3-Grenze, Lüftung prüfen)
        labels:
          severity: warning
          instance: lares-co2-warning

      # CO₂ Kritisch — DIN EN 13779 IDA 4 (>1400 ppm, sustained 2 min)
      - uid: lares-co2-critical
        title: CO₂ Kritisch IDA 4
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -10m)
                  |> filter(fn: (r) => r._measurement == "ventilation" and r["metric"] == "co2_level")
                  |> mean()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - evaluator: {params: [1400], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: CO₂-Wert überschreitet 1400 ppm (IDA-4-Grenze, sofort lüften)
        labels:
          severity: critical
          instance: lares-co2-critical

      # Sungrow Systemfehler — system_state != "Run"
      # Requires json_string_fields = ["system_state"] in Telegraf sungrow consumer.
      # Flux maps string to numeric: "Run" → 0.0, any other state → 1.0
      - uid: lares-sungrow-fault
        title: Wechselrichter Fehler
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -10m)
                  |> filter(fn: (r) => r._measurement == "sungrow" and r["_field"] == "system_state")
                  |> last()
                  |> map(fn: (r) => ({_time: r._time, _value: if r._value == "Run" then 0.0 else 1.0}))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - evaluator: {params: [0.5], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: Sungrow SH8.0RT nicht in Betrieb — Wechselrichter prüfen
        labels:
          severity: critical
          instance: lares-sungrow-fault

      # Lüftung heizt Innenraum — gleiche Bedingung wie automatische Steuerung:
      #   supply_air > extract_air + 1°C  UND  outdoor_air > 20°C  für 30 min
      - uid: lares-ventilation-heating
        title: Lüftung heizt Innenraum
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -15m)
                  |> filter(fn: (r) => r._measurement == "ventilation" and (r["metric"] == "temperature_supply_air" or r["metric"] == "temperature_extract_air" or r["metric"] == "temperature_outdoor_air") and r._field == "value")
                  |> mean()
                  |> group()
                  |> pivot(rowKey: ["_stop"], columnKey: ["metric"], valueColumn: "_value")
                  |> map(fn: (r) => ({_time: now(), _value: if r.temperature_supply_air - r.temperature_extract_air > 1.0 and r.temperature_outdoor_air > 20.0 then 1.0 else 0.0}))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - evaluator: {params: [0.5], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 30m
        annotations:
          summary: "Zuluft seit 30 min wärmer als Innenluft (Δ > 1°C) bei Außenluft > 20°C — Lüftung ausschalten erwägen"
        labels:
          severity: warning
          instance: lares-ventilation-heating

      # Wärmepumpe Fehler — neuer Eintrag im Fehlerspeicher (error_count hat sich in 24 h geändert).
      # error_code ist bei Luxtronik ein Text (ID_WEB_ERROR_Nr0), kommt daher nie in InfluxDB an.
      # Grenze: ein bereits gespeicherter, noch aktiver Fehler wird nicht erneut gemeldet.
      - uid: lares-heatpump-fault
        title: Wärmepumpe Fehler
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 86400, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -24h)
                  |> filter(fn: (r) => r._measurement == "heating" and r["_field"] == "error_count")
                  |> spread()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Novelan Wärmepumpe hat einen neuen Fehler gespeichert — Display am Gerät prüfen
        labels:
          severity: critical
          instance: lares-heatpump-fault

      # Lüftungsanlage Alarm — active_alarm_count > 0 für 2 Minuten
      - uid: lares-vallox-alarm
        title: Lüftungsanlage Alarm
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -10m)
                  |> filter(fn: (r) => r._measurement == "ventilation" and r["metric"] == "active_alarm_count")
                  |> last()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: Vallox Lüftungsanlage meldet einen oder mehrere aktive Alarme
        labels:
          severity: critical
          instance: lares-vallox-alarm

      # Filterwechsel Lüftungsanlage — remaining_filter_days < 30 für 12 Stunden
      - uid: lares-filter-change
        title: Filterwechsel Lüftungsanlage
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -10m)
                  |> filter(fn: (r) => r._measurement == "ventilation" and r["metric"] == "remaining_filter_days")
                  |> last()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - evaluator: {params: [30], type: lt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 12h
        annotations:
          summary: "Lüftungsfilter muss bald gewechselt werden (weniger als 30 Tage verbleibend)"
        labels:
          severity: warning
          instance: lares-filter-change

      # Warmwasser-Ausfall — Ist-Temp > 5°C unter Luxtronik-Sollwert für 30 Minuten
      # Math: setpoint - actual - 5 > 0 ↔ actual < setpoint - 5
      - uid: lares-hot-water-failure
        title: Warmwasser-Ausfall
        condition: E
        data:
          - refId: A
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -30m)
                  |> filter(fn: (r) => r._measurement == "heating" and r._field == "temperature_hot_water")
                  |> mean()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -30m)
                  |> filter(fn: (r) => r._measurement == "heating" and r._field == "temperature_hot_water_setpoint")
                  |> mean()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: D
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: math
              refId: D
              datasource: {type: __expr__, uid: __expr__}
              expression: "$B - $A - 5"
          - refId: E
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: D
              refId: E
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [D]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 30m
        annotations:
          summary: "Warmwassertemperatur mehr als 5°C unter Luxtronik-Sollwert — Wärmepumpe oder Boiler prüfen"
        labels:
          severity: critical
          instance: lares-hot-water-failure

      # Heizstab-Einsatz bei milder Außentemperatur
      # backup_heater_active > 0 UND temperature_outside > 5°C für 15 Minuten
      - uid: lares-backup-heater
        title: Heizstab-Einsatz bei milder Außentemperatur
        condition: F
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -15m)
                  |> filter(fn: (r) => r._measurement == "heating" and r._field == "backup_heater_active")
                  |> mean()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -15m)
                  |> filter(fn: (r) => r._measurement == "heating" and r._field == "temperature_outside")
                  |> mean()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: F
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: F
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - evaluator: {params: [0.5], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
                - evaluator: {params: [5], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 15m
        annotations:
          summary: "Heizstab (ZWE1) aktiv obwohl Außentemperatur über 5°C — Wärmepumpe prüfen"
        labels:
          severity: warning
          instance: lares-backup-heater

      # Legionellen / Warmwasser-Überheizung — temperature_hot_water > 60°C für 10 Minuten
      - uid: lares-legionella-run
        title: Warmwasser Überheizung / Legionellenprogramm
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -10m)
                  |> filter(fn: (r) => r._measurement == "heating" and r._field == "temperature_hot_water")
                  |> mean()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - evaluator: {params: [60], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: "Warmwassertemperatur über 60°C — Legionellenprogramm aktiv oder Überheizung"
        labels:
          severity: warning
          instance: lares-legionella-run

      # PV-Batterie Übertemperatur — battery_temperature > 50°C für 5 Minuten
      - uid: lares-sungrow-battery-temp
        title: PV-Batterie Übertemperatur
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -10m)
                  |> filter(fn: (r) => r._measurement == "sungrow" and r._field == "battery_temperature")
                  |> last()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - evaluator: {params: [50], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "PV-Batterie Temperatur über 50°C — sofort prüfen"
        labels:
          severity: critical
          instance: lares-sungrow-battery-temp

      # PV-Batterie Degradation — battery_state_of_healthy < 70% für 1 Stunde
      - uid: lares-sungrow-battery-health
        title: PV-Batterie Degradation
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -10m)
                  |> filter(fn: (r) => r._measurement == "sungrow" and r._field == "battery_state_of_healthy")
                  |> last()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - evaluator: {params: [70], type: lt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 1h
        annotations:
          summary: "PV-Batterie Gesundheitszustand unter 70% — Batterietausch erwägen"
        labels:
          severity: warning
          instance: lares-sungrow-battery-health

      # Waschmaschine fertig — Leistung war hoch (>200W in letzten 90–10 min), jetzt < 15W für 10 min
      # device: 2307068416409851080248e1e9ceb390
      - uid: lares-waschmaschine-fertig
        title: Waschmaschine fertig
        condition: F
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "meross" and r["device"] == "2307068416409851080248e1e9ceb390" and r["node"] == "electricity" and r["property"] == "power")
                  |> mean()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 5400, to: 600}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -90m, stop: -10m)
                  |> filter(fn: (r) => r._measurement == "meross" and r["device"] == "2307068416409851080248e1e9ceb390" and r["node"] == "electricity" and r["property"] == "power")
                  |> max()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: F
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: F
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - evaluator: {params: [15], type: lt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
                - evaluator: {params: [200], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Waschgang abgeschlossen — Wäsche entnehmen"
        labels:
          severity: informational
          instance: lares-waschmaschine-fertig

      # Trockner fertig — Leistung war hoch (>200W in letzten 90–10 min), jetzt < 15W für 10 min
      # device: 2307067395364351080248e1e9ceaeab
      - uid: lares-trockner-fertig
        title: Trockner fertig
        condition: F
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "meross" and r["device"] == "2307067395364351080248e1e9ceaeab" and r["node"] == "electricity" and r["property"] == "power")
                  |> mean()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 5400, to: 600}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -90m, stop: -10m)
                  |> filter(fn: (r) => r._measurement == "meross" and r["device"] == "2307067395364351080248e1e9ceaeab" and r["node"] == "electricity" and r["property"] == "power")
                  |> max()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: F
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: F
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - evaluator: {params: [15], type: lt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
                - evaluator: {params: [200], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Trockengang abgeschlossen — Wäsche entnehmen"
        labels:
          severity: informational
          instance: lares-trockner-fertig

      # Bridge-Heartbeat: Wärmepumpe — noDataState: Alerting bei ausbleibenden Daten
      - uid: lares-heartbeat-heating
        title: Bridge-Heartbeat Wärmepumpe
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -10m)
                  |> filter(fn: (r) => r._measurement == "heating" and r._field == "temperature_outside")
                  |> last()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - evaluator: {params: [999999], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: "Luxtronik-Bridge sendet keine Daten mehr — Bridge-Container prüfen"
        labels:
          severity: critical
          instance: lares-heartbeat-heating

      # Bridge-Heartbeat: Lüftung — noDataState: Alerting bei ausbleibenden Daten
      - uid: lares-heartbeat-ventilation
        title: Bridge-Heartbeat Lüftung
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -10m)
                  |> filter(fn: (r) => r._measurement == "ventilation" and r["metric"] == "co2_level")
                  |> last()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - evaluator: {params: [999999], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: "Vallox-Bridge sendet keine Daten mehr — Bridge-Container prüfen"
        labels:
          severity: critical
          instance: lares-heartbeat-ventilation

      # Bridge-Heartbeat: Sungrow — noDataState: Alerting bei ausbleibenden Daten
      - uid: lares-heartbeat-sungrow
        title: Bridge-Heartbeat Sungrow
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "sungrow" and r._field == "total_active_power")
                  |> last()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - evaluator: {params: [999999], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          summary: "Sungrow-Bridge (SunGather) sendet keine Daten mehr — Bridge-Container prüfen"
        labels:
          severity: critical
          instance: lares-heartbeat-sungrow

