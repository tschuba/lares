      # BMS-Kommunikation gestört — Batteriespannung seit 10 min durchgehend ~0 V.
      # Sungrow liefert keinen Fehlercode; ein gesundes BMS meldet immer Spannung (auch nachts/Standby).
      # Ausbleibende Daten deckt der Sungrow-Heartbeat ab (daher noDataState: OK).
      - uid: lares-sungrow-bms-comm
        title: PV-Batterie BMS-Kommunikation gestört
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -10m)
                  |> filter(fn: (r) => r._measurement == "sungrow" and r._field == "battery_voltage")
                  |> max()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - evaluator: {params: [10], type: lt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Batteriespannung seit 10 min 0 V — BMS-Kommunikation gestört, Batterie wird nicht genutzt"
        labels:
          severity: critical
          instance: lares-sungrow-bms-comm

      # Verdichter steht — kein Verdichterstart seit 24 h bei kühlem Wetter (Ø Außentemp. < 12 °C).
      # Erkennt "Wärmepumpe meldet keinen Fehler, heizt aber nicht" (Heizstab springt ein).
      - uid: lares-heatpump-compressor-idle
        title: Wärmepumpe Verdichter steht trotz Heizbedarf
        condition: F
        data:
          - refId: A
            relativeTimeRange: {from: 86400, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -24h)
                  |> filter(fn: (r) => r._measurement == "heating" and r._field == "runtime_compressor_starts")
                  |> spread()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 86400, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -24h)
                  |> filter(fn: (r) => r._measurement == "heating" and r._field == "temperature_outside")
                  |> mean()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: F
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: F
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
                - evaluator: {params: [12], type: lt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 1h
        annotations:
          summary: "Kein Verdichterstart seit 24 h bei Außentemperatur < 12 °C — Wärmepumpe heizt nicht, Heizstab prüfen"
        labels:
          severity: warning
          instance: lares-heatpump-compressor-idle

      # Zusatzheizung (ZWE) dauerhaft an — 12 h am Stück ohne Unterbrechung.
      - uid: lares-backup-heater-continuous
        title: Heizstab (ZWE) dauerhaft aktiv
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 43200, to: 0}
            datasourceUid: influxdb-nas
            model:
              query: |
                from(bucket: v.defaultBucket)
                  |> range(start: -12h)
                  |> filter(fn: (r) => r._measurement == "heating" and r._field == "backup_heater_active")
                  |> min()
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - evaluator: {params: [0.5], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Heizstab (ZWE) läuft seit 12 h durchgehend — Wärmepumpe kompensiert nicht mehr"
        labels:
          severity: warning
          instance: lares-backup-heater-continuous
