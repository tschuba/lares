apiVersion: 1

# Jeder Alarm geht in den Alerta-Posteingang (continue: true); kritische zusätzlich als
# Pushover-Push mit Priorität 2. Alles andere: Pushover normal.
policies:
  - orgId: 1
    receiver: pushover
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 24h
    routes:
      - receiver: alerta
        object_matchers: []
        continue: true
        group_by: [alertname]
        group_wait: 10s
        repeat_interval: 24h
      - receiver: pushover-critical
        matchers:
          - severity = critical
        group_by: [alertname]
        group_wait: 30s
        repeat_interval: 4h
