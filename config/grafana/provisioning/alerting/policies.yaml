apiVersion: 1

# Jeder Alarm geht in den Alerta-Posteingang (continue: true); kritische zusätzlich als
# Pushover-Push mit Priorität 2. Alles andere: Pushover normal.
policies:
  - orgId: 1
    receiver: pushover
    group_by: [alertname]
    group_wait: 30s
    group_interval: 30m
    repeat_interval: 7d
    routes:
      - receiver: alerta
        object_matchers: []
        continue: true
        group_by: [alertname]
        group_wait: 10s
        repeat_interval: 24h
      # BMS-Ausfall ist ein Dauerzustand, kein flüchtiges Ereignis -> Erinnerung nur 1x täglich statt alle 4 h; Prio 1 (kein 60-s-Retry); Erinnerung nur alle 7 d (Alerta hält den Stand).
      - receiver: pushover-high
        matchers:
          - instance = lares-sungrow-bms-comm
        group_by: [alertname]
        group_wait: 30s
        group_interval: 30m
        repeat_interval: 7d
      # Bekannte, aktuell nicht behebbare Dauerzustände: 1 Push (Prio 1, kein Retry), Erinnerung 1x pro Woche.
      - receiver: pushover-high
        object_matchers:
          - [instance, "=", lares-heartbeat-ventilation]
        group_by: [alertname]
        group_wait: 30s
        group_interval: 30m
        repeat_interval: 7d
      # DatasourceNoData erbt die Labels der Quellregel (u. a. severity=critical) -> eigene Route davor.
      - receiver: pushover-high
        object_matchers:
          - [alertname, "=", DatasourceNoData]
        group_by: [alertname]
        group_wait: 30s
        group_interval: 30m
        repeat_interval: 7d
      - receiver: pushover-critical
        matchers:
          - severity = critical
        group_by: [alertname]
        group_wait: 30s
        group_interval: 30m
        repeat_interval: 24h
