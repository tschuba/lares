name: Release Please

# ADR-021: SemVer-Releases für grafana-config aus Conventional Commits.
# RELEASE_TOKEN (PAT, Contents + Pull requests rw) ist nötig, damit das Release build-bridges.yml auslöst.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
