name: PR Title

# Erzwingt Conventional Commits im PR-Titel. Mit Squash-Merge wird der Titel zur Commit-Nachricht
# auf main und steuert den SemVer-Bump (feat -> Minor, fix -> Patch, "!" -> Major).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            chore
            docs
            test
            ci
            style
            build
            refactor
            revert
