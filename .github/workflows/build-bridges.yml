name: Build Bridge Images

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
    paths:
      - 'bridges/luxtronik/**'
      - 'bridges/vallox/**'
      - 'bridges/meross2mqtt/**'
      - 'bridges/sungather/**'
      - 'bridges/weewx/**'
      - 'bridges/skoda/**'
      - 'bridges/fritz/**'
      - 'config/grafana/**'
      - '.github/workflows/build-bridges.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'bridges/luxtronik/**'
      - 'bridges/vallox/**'
      - 'bridges/meross2mqtt/**'
      - 'bridges/sungather/**'
      - 'bridges/weewx/**'
      - 'bridges/skoda/**'
      - 'bridges/fritz/**'
      - 'config/grafana/**'
      - '.github/workflows/build-bridges.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      luxtronik: ${{ steps.f.outputs.luxtronik }}
      vallox: ${{ steps.f.outputs.vallox }}
      meross2mqtt: ${{ steps.f.outputs.meross2mqtt }}
      sungather: ${{ steps.f.outputs.sungather }}
      weewx: ${{ steps.f.outputs.weewx }}
      skoda: ${{ steps.f.outputs.skoda }}
      fritz: ${{ steps.f.outputs.fritz }}
      grafana-config: ${{ steps.f.outputs.grafana-config }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            luxtronik:
              - 'bridges/luxtronik/**'
            vallox:
              - 'bridges/vallox/**'
            meross2mqtt:
              - 'bridges/meross2mqtt/**'
            sungather:
              - 'bridges/sungather/**'
            weewx:
              - 'bridges/weewx/**'
            skoda:
              - 'bridges/skoda/**'
            fritz:
              - 'bridges/fritz/**'
            grafana-config:
              - 'config/grafana/**'
      - 'config/grafana/**'

  build-luxtronik:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.luxtronik == 'true' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'luxtronik2mqtt-v'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/luxtronik2mqtt
          tags: |
            type=match,pattern=luxtronik2mqtt-v(.*),group=1
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Luxtronik image
        uses: docker/build-push-action@v5
        with:
          context: ./bridges/luxtronik
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-vallox:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.vallox == 'true' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'vallox2mqtt-v'))
    steps:
