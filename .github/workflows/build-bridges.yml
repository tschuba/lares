name: Build Bridge Images

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
    paths:
      - 'bridges/luxtronik/**'
      - 'bridges/vallox/**'
      - 'bridges/meross2mqtt/**'
      - 'bridges/sungather/**'
      - 'bridges/weewx/**'
      - 'bridges/skoda/**'
      - 'bridges/fritz/**'
      - 'bridges/diun-status/**'
      - '.github/workflows/build-bridges.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'bridges/luxtronik/**'
      - 'bridges/vallox/**'
      - 'bridges/meross2mqtt/**'
      - 'bridges/sungather/**'
      - 'bridges/weewx/**'
      - 'bridges/skoda/**'
      - 'bridges/fritz/**'
      - 'bridges/diun-status/**'
      - '.github/workflows/build-bridges.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-luxtronik:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.modified, 'bridges/luxtronik/') || contains(github.event.*.paths[0], 'bridges/luxtronik/') || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'luxtronik2mqtt-v'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/luxtronik2mqtt
          tags: |
            type=match,pattern=luxtronik2mqtt-v(.*),group=1
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Luxtronik image
        uses: docker/build-push-action@v5
        with:
          context: ./bridges/luxtronik
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-vallox:
