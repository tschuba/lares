# Lares Integration Services on NAS (ADR-014)
# This compose file is deployed on the NAS (192.168.178.163)
# Includes: Mosquitto, all MQTT bridges, WeeWX, Telegraf, InfluxDB

networks:
  lares:
    driver: bridge
    name: lares
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:

  # TLS Certificate Init (ADR-015)
  # Generiert selbst-signiertes TLS-Zertifikat fuer iot.meross.com beim ersten Start.
  # Laeuft einmalig als One-Shot Container; Zertifikate ueberleben Restarts in
  # ./config/mosquitto/certs/ (innerhalb des bestehenden Mosquitto-Config-Volumes).
  cert-init:
    image: alpine
    container_name: cert-init
    command:
      - sh
      - -c
      - |
        if [ ! -f /certs/server.crt ]; then
          echo '[cert-init] Generiere TLS-Zertifikate fuer iot.meross.com...'
          apk add --no-cache openssl
          openssl genrsa -out /certs/ca.key 2048
          openssl req -new -x509 -days 3650 -key /certs/ca.key \
            -out /certs/ca.crt -subj '/CN=Lares CA'
          openssl genrsa -out /certs/server.key 2048
          openssl req -new -key /certs/server.key \
            -out /certs/server.csr -subj '/CN=iot.meross.com'
          openssl x509 -req -days 3650 \
            -in /certs/server.csr -CA /certs/ca.crt -CAkey /certs/ca.key \
            -CAcreateserial -out /certs/server.crt
          echo '[cert-init] Zertifikate erfolgreich erstellt.'
        else
          echo '[cert-init] Zertifikate bereits vorhanden, ueberspringe.'
        fi
    volumes:
      - ./config/mosquitto/certs:/certs

  # Core MQTT Broker
  # Port 1883: interne Services und Home Assistant
  # Port 8883: TLS fuer Meross-Geraete (ADR-015)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: unless-stopped
    networks:
      - lares
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./config/mosquitto:/mosquitto/config
      - ./data/mosquitto:/mosquitto/data
      - ./logs/mosquitto:/mosquitto/log
    environment:
      - MOSQUITTO_USERNAME=${MQTT_USERNAME}
      - MOSQUITTO_PASSWORD=${MQTT_PASSWORD}
    depends_on:
      cert-init:
        condition: service_completed_successfully

  # DNS Interception fuer Meross-Geraete (ADR-015)
  # Leitet iot.meross.com -> NAS-IP um; alle anderen Anfragen an FritzBox weitergeleitet.
  # Voraussetzung: FritzBox DHCP auf NAS (192.168.178.163) als Primaer-DNS konfigurieren,
  # FritzBox selbst (192.168.178.1) als Sekundaer-DNS fuer Ausfallsicherheit.
  dnsmasq:
    image: andyshinn/dnsmasq:latest
    container_name: dnsmasq
    restart: always
    cap_add:
      - NET_ADMIN
    command:
      - "-k"
      - "--address=/iot.meross.com/192.168.178.163"
      - "--server=192.168.178.1"
      - "--no-resolv"
      - "--log-queries"
      - "--listen-address=0.0.0.0"
    ports:
      - "192.168.178.163:53:53/udp"
      - "192.168.178.163:53:53/tcp"
    networks:
      - lares
    healthcheck:
      test: ["CMD", "nslookup", "iot.meross.com", "127.0.0.1"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles:
      - meross

  # Modbus Proxy for Sungrow (ADR-004)
  modbus-proxy:
    image: tiagocoutinho/modbus-proxy:latest
    container_name: modbus-proxy
    restart: unless-stopped
    networks:
      - lares
    ports:
      - "502:502"
    command: ["--config-file", "/config/modbus-proxy.yml"]
    volumes:
      - ./config/modbus-proxy/modbus-proxy.yml:/config/modbus-proxy.yml
    profiles:
      - sungrow

  # Sungrow to MQTT Bridge (ADR-013) - SunGather for Modbus-only access
  sungrow2mqtt:
    image: ghcr.io/tschuba/lares/sungrow2mqtt:latest
    container_name: sungrow2mqtt
    restart: unless-stopped
    user: "0:0"
    networks:
      - lares
    volumes:
      - ./config/sungather:/config
      - ./logs/sungather:/logs
    environment:
      - TZ=Europe/Berlin
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    depends_on:
      - modbus-proxy
      - mosquitto
    profiles:
      - sungrow

  # Vallox to MQTT Bridge (ADR-006)
  vallox2mqtt:
    image: ghcr.io/tschuba/lares/vallox2mqtt:latest
    container_name: vallox2mqtt
    restart: unless-stopped
    networks:
      - lares
    environment:
      - VALLOX_HOST=${VALLOX_IP}
      - POLL_INTERVAL=30
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_CLIENT_ID=vallox2mqtt
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_TOPIC_PREFIX=ventilation/vallox
      - LOG_LEVEL=INFO
    volumes:
      - ./logs/vallox2mqtt:/app/logs
    depends_on:
      - mosquitto
    profiles:
      - ventilation

  # Luxtronik to MQTT Bridge (Novelan heat pump)
  luxtronik2mqtt:
    image: ghcr.io/tschuba/lares/luxtronik2mqtt:latest
    container_name: luxtronik2mqtt
    restart: unless-stopped
    environment:
      - NOVELAN_IP=${NOVELAN_IP}
      - NOVELAN_PORT=8889
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - POLL_INTERVAL=60
      - LOG_LEVEL=INFO
    networks:
      - lares
    depends_on:
      - mosquitto
    profiles:
      - heating

  # Ecowitt to MQTT Bridge
  ecowitt2mqtt:
    image: bachya/ecowitt2mqtt:latest
    container_name: ecowitt2mqtt
    restart: unless-stopped
    environment:
      - ECOWITT2MQTT_MQTT_BROKER=mosquitto
      - ECOWITT2MQTT_MQTT_PORT=1883
      - ECOWITT2MQTT_MQTT_USERNAME=${MQTT_USERNAME}
      - ECOWITT2MQTT_MQTT_PASSWORD=${MQTT_PASSWORD}
      - ECOWITT2MQTT_PORT=4004
      - ECOWITT2MQTT_HASS_DISCOVERY=true
      - ECOWITT2MQTT_MQTT_TOPIC=weather/ecowitt
      - ECOWITT2MQTT_OUTPUT_UNIT_SYSTEM=metric
      - ECOWITT2MQTT_OUTPUT_UNIT_SPEED=km/h
    ports:
      - "4004:4004"
    networks:
      - lares
    depends_on:
      - mosquitto
    profiles:
      - weather

  # WeeWX for weather data upload (ADR-010)
  weewx:
    image: ghcr.io/tschuba/lares/weewx:latest
    container_name: weewx
    restart: unless-stopped
    user: "0:0"
    volumes:
      - ./data/weewx:/data
      - ./config/weewx/weewx.conf.template:/home/weewx/weewx.conf.template:ro
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - WUNDERGROUND_STATION_ID=${WUNDERGROUND_STATION_ID}
      - WUNDERGROUND_API_KEY=${WUNDERGROUND_API_KEY}
      - AWEKAS_USERNAME=${AWEKAS_USERNAME}
      - AWEKAS_PASSWORD=${AWEKAS_PASSWORD}
      - AWEKAS_STATION_ID=${AWEKAS_STATION_ID}
      - WINDY_STATION_ID=${WINDY_STATION_ID}
      - WINDY_API_KEY=${WINDY_API_KEY}
      - CWOP_STATION_ID=${CWOP_STATION_ID}
      - CWOP_PASSWORD=${CWOP_PASSWORD}
      - OPENWEATHER_STATION_ID=${OPENWEATHER_STATION_ID}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    networks:
      - lares
    profiles:
      - weather

  # Meross to MQTT Bridge (ADR-011)
  # Erster Start: einmalige Cloud-Auth zur Ermittlung von UUID und Key aller Geraete.
  # Danach vollstaendig lokale Kommunikation per TLS/MQTT und HTTP.
  # MEROSS_EMAIL und MEROSS_PASSWORD in .env nur fuer die initiale Discovery noetig.
  meross2mqtt:
    image: ghcr.io/tschuba/lares/meross2mqtt:latest
    container_name: meross2mqtt
    restart: unless-stopped
    networks:
      - lares
    volumes:
      - ./config/meross2mqtt:/config
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MEROSS_EMAIL=${MEROSS_EMAIL}
      - MEROSS_PASSWORD=${MEROSS_PASSWORD}
      - ENABLE_HTTP=true
      - HOMIE_PREFIX=homie
      - LOG_LEVEL=INFO
    depends_on:
      - mosquitto
      - dnsmasq
    profiles:
      - meross

  # Telegraf for MQTT to InfluxDB bridge (ADR-011)
  telegraf:
    image: telegraf:latest
    container_name: telegraf
    restart: unless-stopped
    user: "0:0"
    networks:
      - lares
    volumes:
      - ./config/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - INFLUX_HOST=${INFLUX_HOST}
      - INFLUX_PORT=8086
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    depends_on:
      - mosquitto
    profiles:
      - meross

  # InfluxDB 2.x (ADR-005)
  influxdb:
    image: influxdb:2
    container_name: influxdb
    restart: unless-stopped
    networks:
      - lares
    ports:
      - "8086:8086"
    volumes:
      - ./data/influxdb:/var/lib/influxdb2
      - ./config/influxdb:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_RETENTION=30d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
