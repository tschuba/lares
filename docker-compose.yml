# Lares Integration Services on NAS (ADR-014)
# This compose file is deployed on the NAS (192.168.178.163)
# Includes: Mosquitto, all MQTT bridges, WeeWX, Telegraf, InfluxDB

networks:
  lares:
    driver: bridge
    name: lares
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  # Core MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: unless-stopped
    networks:
      - lares
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto:/mosquitto/config:ro
      - ./data/mosquitto:/mosquitto/data
      - ./logs/mosquitto:/mosquitto/log
    environment:
      - MOSQUITTO_USERNAME=${MQTT_USERNAME}
      - MOSQUITTO_PASSWORD=${MQTT_PASSWORD}

  # Modbus Proxy for Sungrow (ADR-004)
  modbus-proxy:
    image: ghcr.io/tiagocoutinho/modbus-proxy:latest
    container_name: modbus-proxy
    restart: unless-stopped
    networks:
      - lares
    ports:
      - "502:502"
    command:
      - "--listen=:502"
      - "--backend=${SUNGROW_IP}:502"
      - "--log-level=info"
    profiles:
      - sungrow

  # Sungrow to MQTT Bridge (ADR-013)
  sungrow2mqtt:
    image: bohdan0/sungrow2mqtt:latest
    container_name: sungrow2mqtt
    restart: unless-stopped
    networks:
      - lares
    environment:
      - MODBUS_HOST=modbus-proxy
      - MODBUS_PORT=502
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_TOPIC_PREFIX=energy/sungrow
      - POLL_INTERVAL=5
    depends_on:
      - modbus-proxy
      - mosquitto
    profiles:
      - sungrow

  # Vallox to MQTT Bridge (ADR-006)
  vallox2mqtt:
    image: ghcr.io/tschuba/lares/vallox2mqtt:latest
    container_name: vallox2mqtt
    restart: unless-stopped
    networks:
      - lares
    environment:
      - VALLOX_HOST=${VALLOX_IP}
      - VALLOX_PORT=18080
      - POLL_INTERVAL=30
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_CLIENT_ID=vallox2mqtt
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_TOPIC_PREFIX=ventilation/vallox
      - LOG_LEVEL=INFO
    volumes:
      - ./logs/vallox2mqtt:/app/logs
    depends_on:
      - mosquitto
    profiles:
      - ventilation

  # Luxtronik to MQTT Bridge (Novelan heat pump)
  luxtronik2mqtt:
    image: ghcr.io/tschuba/lares/luxtronik2mqtt:latest
    container_name: luxtronik2mqtt
    restart: unless-stopped
    env_file:
      - ./config/.env
    environment:
      - MQTT_HOST=mosquitto
    networks:
      - lares
    depends_on:
      - mosquitto
    profiles:
      - heating

  # Ecowitt to MQTT Bridge
  ecowitt2mqtt:
    image: bachya/ecowitt2mqtt:latest
    container_name: ecowitt2mqtt
    restart: unless-stopped
    env_file:
      - ./config/.env
    environment:
      - ECOWITT2MQTT_MQTT_BROKER=mosquitto
      - ECOWITT2MQTT_MQTT_PORT=1883
      - ECOWITT2MQTT_MQTT_USERNAME=${MQTT_USERNAME}
      - ECOWITT2MQTT_MQTT_PASSWORD=${MQTT_PASSWORD}
      - ECOWITT2MQTT_PORT=4004
      - ECOWITT2MQTT_HASS_DISCOVERY=true
      - ECOWITT2MQTT_MQTT_TOPIC=weather/ecowitt
    ports:
      - "4004:4004"
    networks:
      - lares
    depends_on:
      - mosquitto
    profiles:
      - weather

  # WeeWX for weather data upload (ADR-010)
  weewx:
    image: felddy/weewx:latest
    container_name: weewx
    restart: unless-stopped
    env_file:
      - ./config/.env
    volumes:
      - ./data/weewx:/data
    networks:
      - lares
    profiles:
      - weather

  # Meross to MQTT Bridge (ADR-011)
  meross2mqtt:
    image: depau/meross2mqtt:latest
    container_name: meross2mqtt
    restart: unless-stopped
    networks:
      - lares
    volumes:
      - ./config/meross2mqtt:/config
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - ENABLE_HTTP=true
      - HOMIE_PREFIX=homie
      - LOG_LEVEL=INFO
    depends_on:
      - mosquitto
    profiles:
      - meross

  # Telegraf for MQTT to InfluxDB bridge (ADR-011)
  telegraf:
    image: telegraf:latest
    container_name: telegraf
    restart: unless-stopped
    networks:
      - lares
    volumes:
      - ./config/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - INFLUX_HOST=${INFLUX_HOST}
      - INFLUX_PORT=8086
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    depends_on:
      - mosquitto
    profiles:
      - meross

  # InfluxDB 2.x (ADR-005)
  influxdb:
    image: influxdb:2
    container_name: influxdb
    restart: unless-stopped
    networks:
      - lares
    ports:
      - "8086:8086"
    volumes:
      - ./data/influxdb:/var/lib/influxdb2
      - ./config/influxdb:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_RETENTION=30d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
