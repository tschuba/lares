# Alerta = Alarm-Posteingang (Quittieren, Verlauf) für Grafana-Alerting. Siehe ADR-019.
# Deployment: Coolify Docker-Compose-Projekt auf dem Pi (192.168.178.69), nur LAN (keine Subdomain).
# Env in Coolify: ALERTA_DB_PASSWORD
# Grafana-Kontaktpunkt "alerta" zeigt auf http://192.168.178.69:8085/api/webhooks/prometheus
services:
  alerta-db:
    image: postgres:16-alpine
    container_name: alerta-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: alerta
      POSTGRES_USER: alerta
      POSTGRES_PASSWORD: ${ALERTA_DB_PASSWORD:?ALERTA_DB_PASSWORD fehlt}
    volumes:
      - alerta-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alerta"]
      interval: 10s
      retries: 5

  alerta:
    image: alerta/alerta-web:9.1.0
    container_name: alerta
    restart: unless-stopped
    depends_on:
      alerta-db:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      DATABASE_URL: postgres://alerta:${ALERTA_DB_PASSWORD}@alerta-db:5432/alerta
      ALERTA_SVR_CONF_FILE: /app/config/alertad.conf
    volumes:
      - ./config/alerta/alertad.conf:/app/config/alertad.conf:ro

volumes:
  alerta-db:
